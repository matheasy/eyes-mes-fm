<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyesIsWatchin App Lab</title>
<meta name="description" content="Apps made by Steve of the EyesIsWatchin channel.">
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1b1e24;--muted:#5b6370;--accent:#b4235a;--line:#dde1e7}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c2027;--fg:#e9ecf1;--muted:#a3abb8;--accent:#f07aa6;--line:#2c323c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:52rem;margin:0 auto;padding:2.5rem 1rem 3rem}
h1{font-size:2rem;margin:0 0 .3rem}p.lead{color:var(--muted);margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:1rem}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}.card b{display:block;color:var(--accent);margin-bottom:.25rem}.card span{color:var(--muted);font-size:.92rem}
footer{margin-top:3rem;color:var(--muted);font-size:.9rem}footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>👁 EyesIsWatchin App Lab</h1>
<p class="lead">Apps made by Steve. New ones show up here as they are added.</p>
<div class="grid">
<!-- APPS: add one <a class="card"> per app, newest first -->
<a class="card" href="/dice/"><b>Dice</b><span>Roll 1–6 dice and keep a running total.</span></a>
<a class="card" href="/hello/"><b>Hello</b><span>A first test app: proves the site works.</span></a>
</div>
<footer>Watch EyesIsWatchin on <a href="https://www.bitchute.com/channel/LzzSQpmQ4HUK/" rel="noopener">BitChute</a> · Hosted next to <a href="https://mes.fm">MES.fm</a></footer>
</main>
</body>
</html>
